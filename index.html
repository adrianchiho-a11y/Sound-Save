<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<meta name="description" content="Your personal offline music and audio library.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Sound Save</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--panel2:#222938;--line:#30394b;--muted:#9ca8bb;--text:#f4f6fb;--accent:#8b7cff;--accent2:#b2a8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#30285d 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1050px;margin:auto;padding:28px 22px 150px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#9b8cff,#6250d8);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 30px #6757dc55}.brand h1{font-size:21px;margin:0;letter-spacing:-.5px}.brand p{display:none}.offline{display:none}.hero{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-bottom:22px}.eyebrow,.hero h2,.hero p{display:none}.upload{background:var(--accent);color:white;border:0;border-radius:13px;padding:13px 18px;font-weight:700;white-space:nowrap;box-shadow:0 8px 25px #7565ed44}.upload:hover{background:#7969ed}.drop{display:none}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.toolbar h3{margin:0;font-size:18px}.search{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 13px;border-radius:11px;min-width:min(260px,100%);outline:none}.search:focus{border-color:var(--accent)}.stats{color:var(--muted);font-size:12px;margin:0 0 14px}.list{display:grid;gap:9px}.track{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:13px;align-items:center;background:var(--panel);border:1px solid #252d3c;border-radius:15px;padding:12px;min-width:0}.cover{width:46px;height:46px;border-radius:11px;background:linear-gradient(145deg,#39315e,#242c3d);display:grid;place-items:center;font-size:20px}.track-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-meta{color:var(--muted);font-size:12px}.track-actions{display:flex;gap:7px;align-items:center}.small{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 11px}.small.play{background:#6555d8;border-color:#6555d8}.small:hover{filter:brightness(1.15)}.empty{border:1px solid var(--line);background:var(--panel);border-radius:18px;text-align:center;padding:48px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:17px;margin:8px}.player{position:fixed;bottom:0;left:0;right:0;background:#151a25f2;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:13px max(20px,calc((100vw - 1000px)/2));z-index:5}.player-inner{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(130px,1fr) minmax(220px,2fr) minmax(100px,1fr);gap:20px;align-items:center}.now{min-width:0}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now span{font-size:12px;color:var(--muted)}audio{width:100%;height:38px}.player-note{text-align:right;color:var(--muted);font-size:11px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#273149;border:1px solid #475575;border-radius:12px;padding:10px 16px;z-index:10;box-shadow:0 10px 35px #0008}.hidden{display:none!important}footer{text-align:center;color:#758198;font-size:12px;margin-top:35px}
@media(max-width:650px){.shell{padding:20px 14px 150px}.hero{align-items:start;flex-direction:column}.upload{width:100%}.track{grid-template-columns:40px minmax(0,1fr) auto;gap:9px;padding:9px}.cover{width:40px;height:40px}.small{padding:8px}.player-inner{grid-template-columns:1fr;gap:4px}.player-note{display:none}.player{padding:9px 14px}.now span{display:none}audio{height:32px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><div class="logo">♫</div><div><h1>Sound Save</h1></div></div></header>
<section class="hero"><button class="upload" id="choose">＋ Upload audio</button></section>
<input id="files" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus,.aiff,.wma" multiple hidden>

<div class="toolbar"><h3>Your library</h3><input class="search" id="search" type="search" placeholder="Search your audio…"></div>
<p class="stats" id="stats">0 tracks · Stored on this device</p>
<section class="list" id="list"><div class="empty"><div style="font-size:34px">♫</div><b>Your library is waiting</b>Upload MP3s or other audio files to get started.</div></section>

</main>
<div class="player"><div class="player-inner"><div class="now"><b id="nowTitle">Nothing playing</b><span id="nowSub">Choose a track from your library</span></div><audio id="audio" controls preload="metadata"></audio></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const DB_NAME='sound-save-library', DB_VERSION=1, STORE='tracks';
const $=id=>document.getElementById(id);
let db, tracks=[], currentUrl=null, currentId=null, toastTimer;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE)){const st=d.createObjectStore(STORE,{keyPath:'id'});st.createIndex('addedAt','addedAt');}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
async function allTracks(){const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).getAll();return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result.sort((a,b)=>b.addedAt-a.addedAt));req.onerror=()=>reject(req.error);});}
async function addTrack(file){if(!file.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|ogg|flac|aac|opus|aiff|wma)$/i.test(file.name)){throw new Error('Unsupported file: '+file.name);}const track={id:crypto.randomUUID(),name:file.name.replace(/\.[^.]+$/,''),fileName:file.name,mime:file.type||'audio/mpeg',size:file.size,blob:file,addedAt:Date.now()};const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add(track);await txDone(tx);}
async function refresh(){tracks=await allTracks();render();}
function fmtSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function fmtTime(s){if(!Number.isFinite(s))return '';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function render(){const q=$('search').value.trim().toLowerCase();const shown=tracks.filter(t=>(t.name+' '+t.fileName).toLowerCase().includes(q));$('stats').textContent=tracks.length+' track'+(tracks.length===1?'':'s')+' · '+fmtSize(tracks.reduce((n,t)=>n+t.size,0))+' stored on this device';if(!shown.length){$('list').innerHTML='<div class="empty"><div style="font-size:34px">♫</div><b>'+(tracks.length?'No matches':'Your library is waiting')+'</b>'+(tracks.length?'Try another search.':'Upload MP3s or other audio files to get started.')+'</div>';return;}$('list').innerHTML=shown.map(t=>'<article class="track"><div class="cover">♫</div><div style="min-width:0"><div class="track-name" title="'+esc(t.name)+'">'+esc(t.name)+'</div><div class="track-meta">'+fmtSize(t.size)+' · '+new Date(t.addedAt).toLocaleDateString()+'</div></div><div class="track-actions"><button class="small play" data-play="'+t.id+'">▶</button><button class="small" data-delete="'+t.id+'" aria-label="Delete '+esc(t.name)+'">✕</button></div></article>').join('');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function say(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2800);}
async function upload(fileList){const files=Array.from(fileList||[]);if(!files.length)return;let count=0;for(const f of files){try{await addTrack(f);count++;}catch(e){say(e.message);}}await refresh();if(count)say('Added '+count+' audio file'+(count===1?'':'s')+'. Available offline on this device.');$('files').value='';}
async function play(id){const t=tracks.find(x=>x.id===id);if(!t)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(t.blob);currentId=id;$('audio').src=currentUrl;$('nowTitle').textContent=t.name;$('nowSub').textContent=t.fileName;$('audio').play().catch(()=>say('Tap Play to start audio.'));render();}
async function removeTrack(id){const t=tracks.find(x=>x.id===id);if(!t||!confirm('Delete "'+t.name+'" from this device?'))return;const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);await txDone(tx);if(currentId===id){$('audio').pause();$('audio').removeAttribute('src');$('nowTitle').textContent='Nothing playing';$('nowSub').textContent='Choose a track from your library';if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;currentId=null;}await refresh();say('Track deleted.');}
$('choose').onclick=()=>$('files').click();$('files').addEventListener('change',e=>upload(e.target.files));$('search').addEventListener('input',render);
$('list').addEventListener('click',e=>{const p=e.target.closest('[data-play]'),d=e.target.closest('[data-delete]');if(p)play(p.dataset.play);if(d)removeTrack(d.dataset.delete);});


(async()=>{try{db=await openDB();await refresh();}catch(e){say('Local audio storage is unavailable in this browser.');console.error(e);}})();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));}
</script>
</body>
</html>
