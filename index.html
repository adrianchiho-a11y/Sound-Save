<html lang="en">

<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--panel2:#222938;--line:#30394b;--muted:#9ca8bb;--text:#f4f6fb;--accent:#8b7cff;--accent2:#b2a8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#30285d 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1050px;margin:auto;padding:28px 22px 150px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#9b8cff,#6250d8);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 30px #6757dc55}.brand h1{font-size:21px;margin:0;letter-spacing:-.5px}.brand p{display:none}.offline{display:none}.hero{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-bottom:22px}.eyebrow,.hero h2,.hero p{display:none}.upload{background:var(--accent);color:white;border:0;border-radius:13px;padding:13px 18px;font-weight:700;white-space:nowrap;box-shadow:0 8px 25px #7565ed44}.upload:hover{background:#7969ed}.drop{display:none}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.toolbar h3{margin:0;font-size:18px}.search{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 13px;border-radius:11px;min-width:min(260px,100%);outline:none}.search:focus{border-color:var(--accent)}.stats{color:var(--muted);font-size:12px;margin:0 0 14px}.list{display:grid;gap:9px}.toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.folder-row.drop-target,.track.drop-target,.crumb.drop-target{outline:2px dashed var(--accent2);outline-offset:3px;background:#302b50}.track[draggable=true]{cursor:grab}.track[draggable=true]:active{cursor:grabbing}.folder-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:13px;align-items:center;background:var(--panel);border:1px solid #35304f;border-radius:15px;padding:12px}.folder-actions{display:flex;gap:7px;align-items:center}.crumb{color:var(--muted);font-size:13px;margin:-4px 0 13px}.crumb button{border:0;background:none;color:var(--accent2);padding:0;font:inherit;cursor:pointer}.small.secondary{background:#302b50;border-color:#4a407b}.track{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:13px;align-items:center;background:var(--panel);border:1px solid #252d3c;border-radius:15px;padding:12px;min-width:0}.cover{width:46px;height:46px;border-radius:11px;background:linear-gradient(145deg,#39315e,#242c3d);display:grid;place-items:center;font-size:20px}.track-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-meta{color:var(--muted);font-size:12px}.track-actions{display:flex;gap:7px;align-items:center}.small{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 11px}.small.play{background:#6555d8;border-color:#6555d8}.small:hover{filter:brightness(1.15)}.empty{border:1px solid var(--line);background:var(--panel);border-radius:18px;text-align:center;padding:48px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:17px;margin:8px}.player{position:fixed;bottom:0;left:0;right:0;background:#151a25f2;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:13px max(20px,calc((100vw - 1000px)/2));z-index:5}.player-inner{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(130px,1fr) minmax(220px,2fr) minmax(100px,1fr);gap:20px;align-items:center}.now{min-width:0}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now span{font-size:12px;color:var(--muted)}audio{width:100%;height:38px}.player-note{text-align:right;color:var(--muted);font-size:11px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#273149;border:1px solid #475575;border-radius:12px;padding:10px 16px;z-index:10;box-shadow:0 10px 35px #0008}.hidden{display:none!important}footer{text-align:center;color:#758198;font-size:12px;margin-top:35px}
@media(max-width:650px){.shell{padding:20px 14px 150px}.hero{align-items:start;flex-direction:column}.upload{width:100%}.track{grid-template-columns:40px minmax(0,1fr) auto;gap:9px;padding:9px}.cover{width:40px;height:40px}.small{padding:8px}.player-inner{grid-template-columns:1fr;gap:4px}.player-note{display:none}.player{padding:9px 14px}.now span{display:none}audio{height:32px}}
.cloud-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.cloud-controls span{font-size:12px;color:var(--muted)}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.cloud-controls{width:100%;justify-content:flex-start}}
</style>

<body>
<main class="shell">
<header class="top"><div class="brand"><div class="logo">♫</div><div><h1>Sound Save</h1></div></div><div class="cloud-controls"><span id="cloudStatus">Local only</span><button class="small" id="googleLogin">Sign in with Google</button><button class="small hidden" id="cloudSync">Sync now</button><button class="small hidden" id="googleLogout">Sign out</button></div></header>
<section class="hero"><button class="upload" id="choose">＋ Upload audio</button></section>
<input id="files" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus,.aiff,.wma" multiple hidden>

<div class="toolbar"><h3 id="libraryTitle">Your library</h3><div class="toolbar-actions"><button class="small secondary" id="newFolder">＋ Folder</button><input class="search" id="search" type="search" placeholder="Search your audio…"></div></div><div class="crumb" id="breadcrumb"></div>
<p class="stats" id="stats">0 tracks · Stored on this device</p>
<section class="list" id="list"><div class="empty"><div style="font-size:34px">♫</div><b>Your library is waiting</b>Upload MP3s or other audio files to get started.</div></section>

</main>
<div class="player"><div class="player-inner"><div class="now"><b id="nowTitle">Nothing playing</b><span id="nowSub">Choose a track from your library</span></div><audio id="audio" controls preload="metadata"></audio></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytesResumable, getBytes, deleteObject } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-storage.js";

const DB_NAME='sound-save-library', DB_VERSION=2, STORE='tracks', FOLDERS='folders';
const $=id=>document.getElementById(id);

const firebaseConfig = {
  apiKey: "AIzaSyAONE9K5bDx7b2fPJyoRnDwih18MRxaj6w",
  authDomain: "sound-save-f97ec.firebaseapp.com",
  projectId: "sound-save-f97ec",
  storageBucket: "sound-save-f97ec.firebasestorage.app",
  messagingSenderId: "329748669034",
  appId: "1:329748669034:web:0e8eead3599f751557e013",
  measurementId: "G-321J11Z6LX"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const cloudDb = getFirestore(firebaseApp);
const cloudStorage = getStorage(firebaseApp);
let signedInUser = null, cloudBusy = false, syncPending = false;
const cloudUserPath = (uid, type) => collection(cloudDb, "users", uid, type);
function setCloudStatus(message){ $("cloudStatus").textContent = message; }
function scheduleCloudSync(){ if(signedInUser && navigator.onLine) syncCloud().catch(e=>{console.error(e);setCloudStatus("Sync error — "+(e.message||"try again"));}); }
async function saveLocalTrack(t){const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(t);await txDone(tx);}
async function deleteLocalTrack(id){const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);await txDone(tx);}
function uploadAudioWithProgress(path, blob, mime, label, index, total){
 return new Promise((resolve,reject)=>{
  const task=uploadBytesResumable(storageRef(cloudStorage,path),blob,{contentType:mime||"application/octet-stream"});
  task.on("state_changed",snap=>{
   const pct=snap.totalBytes?Math.round(snap.bytesTransferred/snap.totalBytes*100):0;
   setCloudStatus("Uploading "+index+"/"+total+" · "+label+" · "+pct+"%");
  },reject,()=>resolve(task.snapshot));
 });
}
async function syncCloud(){
 if(!signedInUser || !navigator.onLine || !db)return;
 if(cloudBusy){syncPending=true;return;}
 cloudBusy=true;setCloudStatus("Syncing…");
 const uid=signedInUser.uid;
 try{
  setCloudStatus("Checking deleted songs…");
  const tombstoneKey="sound-save-deleted-"+uid;
  const queuedDeletes=JSON.parse(localStorage.getItem(tombstoneKey)||"[]");
  for(const id of queuedDeletes){await setDoc(doc(cloudUserPath(uid,"deletedTracks"),id),{id,deletedAt:Date.now()});}
  if(queuedDeletes.length)localStorage.removeItem(tombstoneKey);
  const deletedSnap=await getDocs(cloudUserPath(uid,"deletedTracks"));
  const deletedIds=new Set(deletedSnap.docs.map(x=>x.id));
  for(const id of deletedIds){try{await deleteObject(storageRef(cloudStorage,"users/"+uid+"/audio/"+id));}catch(e){}await deleteDoc(doc(cloudUserPath(uid,"tracks"),id));await deleteLocalTrack(id);}
  setCloudStatus("Syncing folders…");
  const localFolders=await allFolders();
  const remoteFoldersSnap=await getDocs(cloudUserPath(uid,"folders"));
  const remoteFolders=new Map(remoteFoldersSnap.docs.map(x=>[x.id,x.data()]));
  for(const folder of localFolders){const remote=remoteFolders.get(folder.id);const localTime=folder.updatedAt||folder.addedAt||0;if(!remote||localTime>(remote.updatedAt||0)){await setDoc(doc(cloudUserPath(uid,"folders"),folder.id),{id:folder.id,name:folder.name,parentId:folder.parentId||null,addedAt:folder.addedAt||Date.now(),updatedAt:Math.max(Date.now(),localTime)});}else if((remote.updatedAt||0)>localTime){const tx=db.transaction(FOLDERS,"readwrite");tx.objectStore(FOLDERS).put({...remote,id:folder.id});await txDone(tx);}}
  for(const [id,remote] of remoteFolders){if(!localFolders.some(x=>x.id===id)){const tx=db.transaction(FOLDERS,"readwrite");tx.objectStore(FOLDERS).put({...remote,id});await txDone(tx);}}
  setCloudStatus("Checking song list…");
  const remoteTracksSnap=await getDocs(cloudUserPath(uid,"tracks"));
  const remoteTracks=new Map(remoteTracksSnap.docs.map(x=>[x.id,x.data()]));
  const localTracks=await allTracks();
  let uploadIndex=0;const uploadTotal=localTracks.filter(t=>!deletedIds.has(t.id)&&(!remoteTracks.has(t.id)||(t.updatedAt||t.addedAt||0)>(remoteTracks.get(t.id).updatedAt||0))).length;
  for(const track of localTracks){if(deletedIds.has(track.id))continue;const remote=remoteTracks.get(track.id);const localTime=track.updatedAt||track.addedAt||0;
   if(!remote||localTime>(remote.updatedAt||0)){
    const path="users/"+uid+"/audio/"+track.id;
    uploadIndex++;await uploadAudioWithProgress(path,track.blob,track.mime,""+track.name,uploadIndex,uploadTotal);
    const updatedAt=Math.max(Date.now(),localTime);
    await setDoc(doc(cloudUserPath(uid,"tracks"),track.id),{id:track.id,name:track.name,fileName:track.fileName,mime:track.mime,size:track.size,addedAt:track.addedAt,folderId:track.folderId||null,storagePath:path,updatedAt});
    track.updatedAt=updatedAt;await saveLocalTrack(track);
   }else if((remote.updatedAt||0)>localTime){
    setCloudStatus("Downloading · "+track.name+"…");
    const bytes=await getBytes(storageRef(cloudStorage,remote.storagePath||("users/"+uid+"/audio/"+track.id)));
    track.blob=new Blob([bytes],{type:remote.mime||track.mime||"audio/mpeg"});track.name=remote.name;track.fileName=remote.fileName;track.mime=remote.mime;track.size=remote.size;track.folderId=remote.folderId||null;track.updatedAt=remote.updatedAt;await saveLocalTrack(track);
   }
  }
  for(const [id,remote] of remoteTracks){if(deletedIds.has(id)||localTracks.some(x=>x.id===id))continue;setCloudStatus("Downloading · "+(remote.name||"song")+"…");const bytes=await getBytes(storageRef(cloudStorage,remote.storagePath||("users/"+uid+"/audio/"+id)));const track={id,name:remote.name,fileName:remote.fileName,mime:remote.mime||"audio/mpeg",size:remote.size||bytes.byteLength,blob:new Blob([bytes],{type:remote.mime||"audio/mpeg"}),addedAt:remote.addedAt||Date.now(),updatedAt:remote.updatedAt||Date.now(),folderId:remote.folderId||null};await saveLocalTrack(track);}
  tracks=await allTracks();folders=await allFolders();render();setCloudStatus("Synced · "+(signedInUser.displayName||signedInUser.email||"Google account"));
 }catch(e){setCloudStatus("Sync failed · "+(e.code||e.message||"unknown error"));throw e;
 }finally{cloudBusy=false;if(syncPending){syncPending=false;setTimeout(()=>syncCloud().catch(e=>{console.error(e);setCloudStatus("Sync error — "+(e.message||"try again"));}),0);}}
}
onAuthStateChanged(auth,async user=>{signedInUser=user;$("googleLogin").classList.toggle("hidden",!!user);$("googleLogout").classList.toggle("hidden",!user);$("cloudSync").classList.toggle("hidden",!user);if(user){setCloudStatus("Signed in · syncing…");try{await syncCloud();}catch(e){console.error(e);setCloudStatus("Sync error — "+(e.message||"check Firebase setup"));}}else setCloudStatus("Local only");});
$("googleLogin").addEventListener("click",async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());}catch(e){console.error(e);say("Google sign-in failed: "+(e.message||e.code));}});
$("googleLogout").addEventListener("click",()=>signOut(auth).catch(e=>say(e.message)));
$("cloudSync").addEventListener("click",()=>syncCloud().catch(e=>{console.error(e);say("Sync failed: "+(e.message||e.code));}));
window.addEventListener("online",()=>scheduleCloudSync());

let db, tracks=[], folders=[], currentUrl=null, currentId=null, toastTimer, currentFolderId=null, playlist=[], playlistIndex=-1, playlistFolderId=null, draggedTrackId=null;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE)){const st=d.createObjectStore(STORE,{keyPath:'id'});st.createIndex('addedAt','addedAt');}if(!d.objectStoreNames.contains(FOLDERS))d.createObjectStore(FOLDERS,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
async function allTracks(){const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).getAll();return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result.sort((a,b)=>a.addedAt-b.addedAt));req.onerror=()=>reject(req.error);});}
async function allFolders(){const tx=db.transaction(FOLDERS,'readonly');const req=tx.objectStore(FOLDERS).getAll();return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function addTrack(file){if(!file.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|ogg|flac|aac|opus|aiff|wma)$/i.test(file.name))throw new Error('Unsupported file: '+file.name);const track={id:crypto.randomUUID(),name:file.name.replace(/\.[^.]+$/,''),fileName:file.name,mime:file.type||'audio/mpeg',size:file.size,blob:file,addedAt:Date.now(),updatedAt:Date.now(),folderId:currentFolderId};const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add(track);await txDone(tx);scheduleCloudSync();}
async function refresh(){tracks=await allTracks();folders=await allFolders();render();}
function fmtSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function fmtTime(s){if(!Number.isFinite(s))return '';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function say(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2800);}
function folderPath(id){const path=[];let f=folders.find(x=>x.id===id);while(f){path.unshift(f);f=folders.find(x=>x.id===f.parentId);}return path;}
function render(){const q=$('search').value.trim().toLowerCase();const childFolders=folders.filter(f=>(f.parentId||null)===currentFolderId && f.name.toLowerCase().includes(q));const shown=tracks.filter(t=>(t.folderId||null)===currentFolderId&&(t.name+' '+t.fileName).toLowerCase().includes(q));const here=currentFolderId?folders.find(f=>f.id===currentFolderId):null;$('libraryTitle').textContent=here?here.name:'Your library';$('breadcrumb').innerHTML=currentFolderId?'<button data-root>Library</button> / '+folderPath(currentFolderId).map((f,i)=>i===folderPath(currentFolderId).length-1?esc(f.name):'<button data-folder=\"'+f.id+'\">'+esc(f.name)+'</button>').join(' / '):'';$('stats').textContent=shown.length+' track'+(shown.length===1?'':'s')+' · '+fmtSize(shown.reduce((n,t)=>n+t.size,0))+' in this folder';let html=childFolders.map(f=>'<article class="folder-row" data-drop-folder="'+f.id+'"><div class="cover">📁</div><div style="min-width:0"><div class="track-name">'+esc(f.name)+'</div><div class="track-meta">Folder</div></div><div class="folder-actions"><button class="small" data-open-folder="'+f.id+'">Open</button><button class="small play" data-play-folder="'+f.id+'">'+(playlistFolderId===f.id&&!$('audio').paused?'♫ Playing':'▶ Play')+'</button><button class="small" data-rename-folder="'+f.id+'">Rename</button></div></article>').join('');html+=shown.map(t=>'<article class="track" draggable="true" data-drag-track="'+t.id+'"><div class="cover">♫</div><div style="min-width:0"><div class="track-name" title="'+esc(t.name)+'">'+esc(t.name)+'</div><div class="track-meta">'+fmtSize(t.size)+' · '+new Date(t.addedAt).toLocaleDateString()+'</div></div><div class="track-actions"><button class="small play" data-play="'+t.id+'">'+(currentId===t.id&&!$('audio').paused?'♫':'▶')+'</button><button class="small" data-rename-track="'+t.id+'">Rename</button><button class="small" data-delete="'+t.id+'" aria-label="Delete '+esc(t.name)+'">✕</button></div></article>').join('');$('list').innerHTML=html||'<div class="empty"><div style="font-size:34px">♫</div><b>'+(q?'No matches':here?'This folder is empty':'Your library is waiting')+'</b>'+(q?'Try another search.':'Upload audio or create a folder to get started.')+'</div>'; }
async function upload(fileList){const files=Array.from(fileList||[]);if(!files.length)return;let count=0;for(const f of files){try{await addTrack(f);count++;}catch(e){say(e.message);}}await refresh();scheduleCloudSync();if(count)say('Added '+count+' audio file'+(count===1?'':'s')+'.');$('files').value='';}
async function play(id){const t=tracks.find(x=>x.id===id);if(!t)return;playlist=[];playlistIndex=-1;playlistFolderId=null;await playTrack(t);}
async function playTrack(t){if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(t.blob);currentId=t.id;$('audio').src=currentUrl;$('nowTitle').textContent=t.name;$('nowSub').textContent=t.fileName;$('audio').play().catch(()=>say('Tap Play to start audio.'));render();}
function playFolder(id){const folderTracks=tracks.filter(t=>t.folderId===id).sort((a,b)=>a.addedAt-b.addedAt);if(!folderTracks.length){say('This folder has no audio files yet.');return;}playlist=folderTracks;playlistIndex=0;playlistFolderId=id;playTrack(playlist[0]);}
$('audio').addEventListener('ended',()=>{if(playlist.length&&playlistIndex<playlist.length-1){playlistIndex++;playTrack(playlist[playlistIndex]);}else{playlist=[];playlistIndex=-1;playlistFolderId=null;render();}});$('audio').addEventListener('play',render);$('audio').addEventListener('pause',render);
async function removeTrack(id){const t=tracks.find(x=>x.id===id);if(!t||!confirm('Delete "'+t.name+'" from this device?'))return;const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);await txDone(tx);if(signedInUser){const key='sound-save-deleted-'+signedInUser.uid;const queued=JSON.parse(localStorage.getItem(key)||'[]');if(!queued.includes(id)){queued.push(id);localStorage.setItem(key,JSON.stringify(queued));}scheduleCloudSync();}if(currentId===id){$('audio').pause();$('audio').removeAttribute('src');$('nowTitle').textContent='Nothing playing';$('nowSub').textContent='Choose a track from your library';if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;currentId=null;}await refresh();say('Track deleted.');}
async function createFolder(){const name=prompt('Folder name:');if(!name||!name.trim())return;const folder={id:crypto.randomUUID(),name:name.trim(),parentId:currentFolderId,addedAt:Date.now()};const tx=db.transaction(FOLDERS,'readwrite');folder.updatedAt=Date.now();tx.objectStore(FOLDERS).add(folder);await txDone(tx);await refresh();scheduleCloudSync();}
async function renameFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;const name=prompt('Rename folder:',f.name);if(!name||!name.trim()||name.trim()===f.name)return;f.name=name.trim();f.updatedAt=Date.now();const tx=db.transaction(FOLDERS,'readwrite');tx.objectStore(FOLDERS).put(f);await txDone(tx);await refresh();scheduleCloudSync();say('Folder renamed.');}
async function renameTrack(id){const t=tracks.find(x=>x.id===id);if(!t)return;const name=prompt('Rename audio:',t.name);if(!name||!name.trim()||name.trim()===t.name)return;t.name=name.trim();t.updatedAt=Date.now();const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(t);await txDone(tx);await refresh();scheduleCloudSync();if(currentId===id)$('nowTitle').textContent=t.name;say('Audio renamed.');}
async function moveTrack(id,targetFolderId){const t=tracks.find(x=>x.id===id);if(!t||(t.folderId||null)===(targetFolderId||null))return;t.folderId=targetFolderId||null;t.updatedAt=Date.now();const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(t);await txDone(tx);await refresh();scheduleCloudSync();say(targetFolderId?'Moved into folder.':'Moved out to library.');}
function clearDropTargets(){document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));}
$('list').addEventListener('dragstart',e=>{const track=e.target.closest('[data-drag-track]');if(!track)return;draggedTrackId=track.dataset.dragTrack;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedTrackId);});
$('list').addEventListener('dragover',e=>{const folder=e.target.closest('[data-drop-folder]');if(!folder||!draggedTrackId)return;e.preventDefault();e.dataTransfer.dropEffect='move';clearDropTargets();folder.classList.add('drop-target');});
$('list').addEventListener('dragleave',e=>{const folder=e.target.closest('[data-drop-folder]');if(folder&&!folder.contains(e.relatedTarget))folder.classList.remove('drop-target');});
$('list').addEventListener('drop',e=>{const folder=e.target.closest('[data-drop-folder]');if(!folder||!draggedTrackId)return;e.preventDefault();const id=draggedTrackId;draggedTrackId=null;clearDropTargets();moveTrack(id,folder.dataset.dropFolder);});
$('breadcrumb').addEventListener('dragover',e=>{if(!draggedTrackId)return;const target=e.target.closest('[data-root],[data-folder]');if(!target)return;e.preventDefault();e.dataTransfer.dropEffect='move';clearDropTargets();target.classList.add('drop-target');});
$('breadcrumb').addEventListener('dragleave',e=>{const target=e.target.closest('[data-root],[data-folder]');if(target&&!target.contains(e.relatedTarget))target.classList.remove('drop-target');});
$('breadcrumb').addEventListener('drop',e=>{const target=e.target.closest('[data-root],[data-folder]');if(!target||!draggedTrackId)return;e.preventDefault();const id=draggedTrackId;draggedTrackId=null;clearDropTargets();moveTrack(id,target.dataset.root!==undefined?null:target.dataset.folder);});
document.addEventListener('dragend',()=>{draggedTrackId=null;clearDropTargets();});
$('choose').onclick=()=>$('files').click();$('files').addEventListener('change',e=>upload(e.target.files));$('search').addEventListener('input',render);$('newFolder').onclick=createFolder;
$('list').addEventListener('click',e=>{const p=e.target.closest('[data-play]'),d=e.target.closest('[data-delete]'),o=e.target.closest('[data-open-folder]'),pf=e.target.closest('[data-play-folder]'),rf=e.target.closest('[data-rename-folder]'),rt=e.target.closest('[data-rename-track]');if(p)play(p.dataset.play);if(d)removeTrack(d.dataset.delete);if(o){currentFolderId=o.dataset.openFolder;$('search').value='';render();}if(pf)playFolder(pf.dataset.playFolder);if(rf)renameFolder(rf.dataset.renameFolder);if(rt)renameTrack(rt.dataset.renameTrack);});
$('breadcrumb').addEventListener('click',e=>{if(e.target.matches('[data-root]'))currentFolderId=null;else if(e.target.matches('[data-folder]'))currentFolderId=e.target.dataset.folder;$('search').value='';render();});
(async()=>{try{db=await openDB();await refresh();scheduleCloudSync();}catch(e){say('Local audio storage is unavailable in this browser.');console.error(e);}})();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));}</script>
</body>
</html>
